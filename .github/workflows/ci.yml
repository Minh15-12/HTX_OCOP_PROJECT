name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: htx_ocop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pdo_sqlite, sqlite3, dom, filter, gd, json, redis, bcmath, curl, fileinfo
        coverage: none

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Copy .env
      working-directory: ./backend
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate key
      working-directory: ./backend
      run: php artisan key:generate

    - name: Run Migrations on PostgreSQL
      working-directory: ./backend
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5433
        DB_DATABASE: htx_ocop
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
      run: php artisan migrate --force

    - name: Check Code Style (Pint)
      working-directory: ./backend
      run: ./vendor/bin/pint --test

    - name: Execute tests
      working-directory: ./backend
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
        CACHE_STORE: array
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
        MAIL_MAILER: array
      run: ./vendor/bin/phpunit --display-deprecations --display-warnings

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Run Build
      working-directory: ./frontend
      run: npm run build
