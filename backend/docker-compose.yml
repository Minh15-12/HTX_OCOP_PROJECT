version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: htx_ocop_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - htx_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: htx_ocop_backend
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
    networks:
      - htx_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: htx_ocop_worker
    command: php artisan queue:work redis --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
    networks:
      - htx_network

  postgres:
    image: postgres:16-alpine
    container_name: htx_ocop_postgres
    environment:
      POSTGRES_DB: htx_ocop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - htx_network

  redis:
    image: redis:7-alpine
    container_name: htx_ocop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - htx_network

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: htx_ocop_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - htx_network

networks:
  htx_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
