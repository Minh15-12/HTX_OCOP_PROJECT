services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: htx-ocop-backend
    container_name: htx-ocop-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME="HTX OCOP Management System"
      - APP_ENV=production
      - APP_KEY=base64:w8O6b7rYwQ1N1r7x/wQ+N0123456789abcdefghijkl=
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=htx_ocop
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - FILESYSTEM_DISK=minio
      - EVIDENCE_DISK=minio
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=htx-ocop-evidence
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - MINIO_KEY=minioadmin
      - MINIO_SECRET=minioadmin
      - MINIO_REGION=us-east-1
      - MINIO_BUCKET=htx-ocop-evidence
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_USE_PATH_STYLE_ENDPOINT=true
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - SANCTUM_STATEFUL_DOMAINS=localhost:3000,localhost:3001,127.0.0.1:3000,127.0.0.1:3001
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./backend/.env.production:/var/www/html/.env
    networks:
      - htx-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: htx-ocop-backend
    container_name: htx-ocop-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment:
      - APP_NAME="HTX OCOP Management System"
      - APP_ENV=production
      - APP_KEY=base64:w8O6b7rYwQ1N1r7x/wQ+N0123456789abcdefghijkl=
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=htx_ocop
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - FILESYSTEM_DISK=minio
      - EVIDENCE_DISK=minio
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=htx-ocop-evidence
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      - ./backend/.env.production:/var/www/html/.env
    networks:
      - htx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: htx-ocop-frontend
    container_name: htx-ocop-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - htx-network

  db:
    image: postgres:16-alpine
    container_name: htx-ocop-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=htx_ocop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - htx-network

  redis:
    image: redis:7-alpine
    container_name: htx-ocop-redis
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - htx-network

  minio:
    image: cleanstart/minio:latest
    container_name: htx-ocop-minio
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${HOST_MINIO_PORT:-9000}:9000"
      - "${HOST_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - htx-network

networks:
  htx-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  minio-data:
