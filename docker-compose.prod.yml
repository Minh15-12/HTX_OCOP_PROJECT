version: '3.8'

services:
  # ============================================================================
  # NGINX REVERSE PROXY & SSL TERMINATION
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: htx-ocop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./backend/storage/app/public:/var/www/html/storage:ro
    depends_on:
      - backend
      - frontend
    networks:
      - htx-network

  # ============================================================================
  # LARAVEL 11 BACKEND API (PHP 8.2-FPM)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: htx-ocop-backend:latest
    container_name: htx-ocop-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://localhost
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=htx_ocop
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-no-reply@htxtantien.vn}
      - MAIL_FROM_NAME="HTX Nông Nghiệp Tân Tiến - OCOP"
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - db
      - redis
    networks:
      - htx-network

  # ============================================================================
  # ASYNCHRONOUS QUEUE WORKER (EMAILS, OCOP VERIFICATIONS, EXPORTS)
  # ============================================================================
  queue:
    image: htx-ocop-backend:latest
    container_name: htx-ocop-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120 --max-time=3600
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=htx_ocop
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
    depends_on:
      - backend
      - redis
      - db
    networks:
      - htx-network

  # ============================================================================
  # CRON TASK SCHEDULER (PHI EXPIRATION, RECURRING TASKS)
  # ============================================================================
  scheduler:
    image: htx-ocop-backend:latest
    container_name: htx-ocop-scheduler
    restart: unless-stopped
    command: /bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction & sleep 60; done"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=htx_ocop
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - db
      - redis
    networks:
      - htx-network

  # ============================================================================
  # REACT 18 + VITE FRONTEND (SPA)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: htx-ocop-frontend:latest
    container_name: htx-ocop-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - htx-network

  # ============================================================================
  # POSTGRESQL 15 DATABASE (ENTERPRISE ENGINES & DATA INTEGRITY)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: htx-ocop-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=htx_ocop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - htx-network

  # ============================================================================
  # REDIS 7 (CACHE, SESSIONS & QUEUE STORAGE)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: htx-ocop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - htx-network

  # ============================================================================
  # MINIO S3 COMPATIBLE OBJECT STORAGE (OCOP DIGITAL EVIDENCES)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: htx-ocop-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - htx-network

  createbuckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: htx-ocop-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/htx-ocop-evidence;
      /usr/bin/mc anonymous set download myminio/htx-ocop-evidence;
      exit 0;
      "
    networks:
      - htx-network

  # ============================================================================
  # CERTBOT (LET'S ENCRYPT AUTO-RENEWAL)
  # ============================================================================
  certbot:
    image: certbot/certbot
    container_name: htx-ocop-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - htx-network

networks:
  htx-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  minio-data:
